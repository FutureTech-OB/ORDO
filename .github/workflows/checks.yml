name: ORDO checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[mesa,harness,cookbooks]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_mcp.py
      - run: python -m examples.llm_nhb_original.sources --download
      - run: python tools/replay_ordo_v2_review.py
      - run: python tools/replay_organizational_conventions.py --evidence docs/organizational_conventions/results
